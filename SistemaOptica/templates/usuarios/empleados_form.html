{% extends 'index.html' %}

{% block content %}
<h2>Agregar Empleado</h2>

<form method="POST">
    {% csrf_token %}
    <input type="text" class="form-control mb-2" name="username" placeholder="Usuario" required>
    <input type="password" class="form-control mb-2" name="password" placeholder="Contraseña" required>
    <select class="form-control mb-2" name="rol">
        <option value="administrador">Administrador</option>
        <option value="operador">Empleado</option>
    </select>
    <button type="submit" class="btn btn-success">Guardar</button>
</form>
{% endblock %}
