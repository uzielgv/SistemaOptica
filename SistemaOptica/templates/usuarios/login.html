<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-gradient-primary">

<div class="container mt-5">
    <div class="card p-4 shadow">

        <h3 class="text-center mb-4">Iniciar Sesión</h3>

        <form method="POST">
            {% csrf_token %}
            <input type="text" class="form-control form-control-user mb-3" name="username" placeholder="Usuario" required>
            <input type="password" class="form-control form-control-user mb-3" name="password" placeholder="Contraseña" required>
            <button type="submit" class="btn btn-primary btn-user btn-block">Ingresar</button>
        </form>
        <a href="{% url 'registro' %}" class="btn btn-secondary w-100 mt-2">
            Crear cuenta
        </a>
    </div>
</div>

</body>
</html>
