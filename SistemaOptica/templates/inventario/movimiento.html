{% extends 'index.html' %}

{% block content %}

<h1 class="h3 mb-4 text-gray-800">Movimientos de Inventario</h1>

<div class="card shadow">
    <div class="card-body">

        <form method="POST" action="{% url 'registrar_movimiento' %}">
            {% csrf_token %}

            <label>Producto</label>
            <select name="producto" class="form-control mb-2" required>
                <option value="">Seleccione un producto</option>
                {% for p in productos %}
                    <option value="{{ p.producto_id }}">{{ p.nombre }}</option>
                {% endfor %}
            </select>
            <input class="form-control mb-2" name="cantidad" placeholder="Cantidad" required>

            <select name="tipo" class="form-control mb-2">
                <option value="entrada">Entrada</option>
                <option value="salida">Salida</option>
            </select>

            <button class="btn btn-success">
                <i class="fas fa-save"></i> Registrar
            </button>

        </form>
    <div class="col-md-6">
        <a href="{% url 'historial_movimientos' %}" class="btn btn-secondary btn-block">
            <i class="fas fa-list"></i> Volver al Historial
        </a>
    </div>
    </div>
</div>

{% endblock %}
