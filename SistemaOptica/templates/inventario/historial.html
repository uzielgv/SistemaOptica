{% extends 'index.html' %}

{% block content %}
<h2>Historial de Movimientos</h2>

  <div class="col-md-6">
        <a href="{% url 'registrar_movimiento' %}" class="btn btn-primary btn-block">
            <i class="fas fa-plus"></i> Registrar Movimiento
        </a>
    </div>

<table class="table">
  <thead>
  <tr>
    <th>Producto</th>
    <th>Tipo</th>
    <th>Cantidad</th>
    <th>Fecha</th>
  </tr>
  </thead>

  <tbody>
  {% for m in movimientos %}
  <tr>
    <td>{{ m.producto.nombre }}</td>
    <td>{{ m.tipo }}</td>
    <td>{{ m.cantidad }}</td>
    <td>{{ m.fecha_movimiento|date:"d/m/Y H:i" }}</td>
  </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
