{% extends 'base.html' %}

{% block content %}
<h2>Historial de Movimientos</h2>

<table class="table">
  <thead>
  <tr>
    <th>Producto</th>
    <th>Tipo</th>
    <th>Cantidad</th>
    <th>Fecha</th>
  </tr>
  </thead>

  <tbody>
  {% for m in movimientos %}
  <tr>
    <td>{{ m.producto.nombre }}</td>
    <td>{{ m.tipo }}</td>
    <td>{{ m.cantidad }}</td>
    <td>{{ m.fecha }}</td>
  </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
